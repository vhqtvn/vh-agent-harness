# go-test — full-suite Go gate with REQUIRED LiveBridge.
#
# Runs the complete `go test ./...` suite on ubuntu-latest under two exact
# Node pins (18.17.1 and 24.18.0), the versions the bridge is supported on.
# `VH_REQUIRE_LIVE_BRIDGE=1` is step-scoped to the test command: if the
# LiveBridge test cannot genuinely execute (short mode, missing node, missing
# npm, or failed npm install), it FAILS instead of skipping. No leg uses
# -short, continue-on-error, or any allowed-failure escape — either leg
# failing makes the workflow red.
#
# The LiveBridge test stages the canonical corpus itself (templates/core/
# .opencode), installs its npm deps in scratch, and invokes the real node
# bridge — so a plain `go test` is sufficient; no make target is needed.
#
# ci-aggregate (below) is the workflow's stable blocking sentinel: branch
# protection pins ONE stable job name instead of the matrix legs, so matrix
# churn cannot silently drop a leg out of the required-check set. Its
# contract is asserted by internal/ci_contract_test.go.

name: go-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.17.1", "24.18.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Full Go suite with required LiveBridge
        env:
          VH_REQUIRE_LIVE_BRIDGE: "1"
        run: go test ./... -count=1

  # ci-aggregate — stable aggregate blocking status (P1-CI-002 / P2).
  #
  # ONE final job that depends on every designated blocking job in this
  # workflow. Branch protection can require THIS stable name instead of the
  # individual matrix legs, so adding/renaming legs can never leave the
  # required-check set stale.
  #
  # Semantics — B1 vs B2, deliberately NOT collapsed:
  #   - This job aggregates HOSTED VERIFICATION OUTCOMES (a B1 signal): did
  #     each blocking dependency's canonical command set succeed on the
  #     pushed revision?
  #   - It says NOTHING about working-tree/transition cleanliness (B2) —
  #     that is a local property the commit-gate owns. This job must never
  #     be read or reported as generic "full green".
  #
  # It summarizes — never replaces — individual job statuses: each
  # dependency's result is emitted to the step summary, and any failure,
  # cancellation, or unexpected skip fails this job. Live-run behavior is
  # exercised on the first push/PR after this file lands (structural
  # properties are asserted offline by internal/ci_contract_test.go).
  ci-aggregate:
    name: ci-aggregate
    needs: [go-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Per-dependency result summary
        run: |
          echo "## ci-aggregate — blocking CI outcomes for this revision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Blocking job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| go-test (full node matrix) | ${{ needs.go-test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "B1 signal only: hosted verification outcomes. Individual job" >> "$GITHUB_STEP_SUMMARY"
          echo "pages remain authoritative; this is not a B2 (working-tree" >> "$GITHUB_STEP_SUMMARY"
          echo "cleanliness) claim." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on any non-success dependency
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::ci-aggregate: a blocking CI dependency did not succeed (failure, cancelled, or unexpectedly skipped). See the per-dependency summary."
          exit 1
