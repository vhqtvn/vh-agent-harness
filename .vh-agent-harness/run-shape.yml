run_shape_version: "0.1"
# S4 runtime shape (.vh-agent-harness/run-shape.yml). Project-owned: edit freely;
# `vh-agent-harness update` never overwrites this file. See the run-shape spec.
runtime:
  backend: host-shell
# services: {}      # none for host-shell; declare for docker_compose
# lifecycle: {}     # hooks are scripts/ pointers; absent = no-op
# runners: {}
# verbs: {}
# exec_sandbox.min_mode is the binary-enforced sandbox MODE-FLOOR (Level-B
# read-code containment). strict = writes-outside-tmp and network are
# impossible; the floor clamps --sandbox UP so an exec-sandbox grant cannot be
# escaped (P5 bypass denied). See read-only-execution-policy.md.
exec_sandbox:
  min_mode: strict
