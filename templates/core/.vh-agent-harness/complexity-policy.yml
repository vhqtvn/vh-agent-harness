version: 1
enabled: true

defaults:
  event_file_lines: 350
  snapshot_file_lines: 500

per_language:
  ".go": {}
  ".cjs": {}
  ".cts": {}
  ".js": {}
  ".jsx": {}
  ".mjs": {}
  ".mts": {}
  ".py": {}
  ".ts": {}
  ".tsx": {}

exclude:
  event_paths:
    - ".git/**"
    - ".opencode/state/**"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "tmp/**"

  snapshot_paths:
    - ".git/**"
    - ".opencode/**"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "tmp/**"

  snapshot_suffixes:
    - "_test.go"

doctor:
  max_candidates: 10

recurrence:
  enabled: false
