# vh-harness-profile.yml (platform_armed) - vh-agent-harness platform default.
#
# This is the S3 feature-surface selection file. It is platform_armed: the
# platform owns the schema + this default, and the project edits within the
# envelope. On update the substrate does a schema-aware STRUCTURAL reconcile
# (union append-only arrays; project-wins per keyed feature; project-selectable
# profile within the enum). It NEVER wholesale-overwrites this file.
#
# This is the platform DEFAULT (v1): the minimal core corpus. Overlays widen
# modules/overlays/features in later slices; the schema
# (internal/schema/harness_profile.go) is the contract.
#
# DUAL-PURPOSE SEPARATION: this file is the RECONCILIATION BASELINE only — the
# arrays here are unioned into EXISTING live profiles on every update, so they
# must stay minimal (widening them would backfill every installed harness).
# The greenfield full-install selection lives SEPARATELY in the frozen,
# install-only recipe at templates/install/full-harness-profile.yml
# (corpus.InstallFS; never rendered, never reconciled). Do not widen this
# default to distribute new surface — record a default-in/default-out decision
# in the bootstrap inventory ledger instead (see the recipe's header comment).
profile: minimal
features:
  backlog: true
  # Shipped default-on overlay pilots (middle lifecycle tier, strictly
  # INFORMS-only: skills only, no agent/command/permission/gate). Default true
  # means every consumer gains them on update; disable any via `false`.
  # See `vh-agent-harness help migrate` for the release that introduced this.
  formal-verification-pilot: true
  resolve-first-pilot: true
  contract-invariant-audit-pilot: true
overlays: []
policy_packs: []
